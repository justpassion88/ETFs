name: Weekly ETF Data Update

on:
  schedule:
    # Chạy vào 6:00 AM (UTC) mỗi thứ Bảy (tương đương 1:00 PM giờ Việt Nam)
    # Cron format: minute hour day-of-month month day-of-week
    - cron: '0 6 * * 6'
  
  # Cho phép chạy thủ công từ GitHub Actions tab
  workflow_dispatch:

jobs:
  update-etf-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run ETF data update
        run: |
          python scheduled_update.py
      
      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      
      - name: Commit and push data
        run: |
          git add ETF/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Cập nhật dữ liệu ETF - $(date +'%d/%m/%Y %H:%M')"
            git push
          fi
